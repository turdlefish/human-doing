  <path d="M245 245 C222 222 194 196 166 178" fill="none" stroke="#6CC59A" stroke-width="7" stroke-linecap="round"/>
  <path d="M260 228 C262 158 314 110 386 112 C386 184 334 228 260 228 Z" fill="#7CCFAA"/>
  <path d="M269 219 C298 192 328 162 360 134" fill="none" stroke="#5DB58E" stroke-width="7" stroke-linecap="round"/>
  <path d="M296 146 C316 132 338 125 364 124" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 208 C240 180 246 150 264 132 C281 160 275 190 256 208 Z" fill="#A6E6C6"/>
  <!-- the pot, with a face -->
  <path d="M170 330 H342 L324 418 C320 436 308 448 290 448 H222 C204 448 192 436 188 418 Z" fill="#FFB9CB"/>
