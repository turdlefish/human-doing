<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tend's icon: a little potted plant with a smile. The plant shapes are
       mirrored in tend-android/app/src/main/res/drawable/ic_launcher_foreground.xml. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDCE8"/>
      <stop offset="1" stop-color="#E8DDFF"/>
    </linearGradient>
    <g id="shapes">
      <path d="M256 304 C256 272 254 240 256 206" fill="none" stroke-width="16" stroke-linecap="round"/>
      <path d="M252 254 C206 258 148 230 140 160 C204 150 246 188 252 254 Z"/>
      <path d="M260 228 C262 158 314 110 386 112 C386 184 334 228 260 228 Z"/>
      <path d="M256 208 C240 180 246 150 264 132 C281 160 275 190 256 208 Z"/>
      <path d="M170 330 H342 L324 418 C320 436 308 448 290 448 H222 C204 448 192 436 188 418 Z"/>
      <path d="M172 288 H340 C352 288 362 298 362 310 V314 C362 326 352 336 340 336 H172 C160 336 150 326 150 314 V310 C150 298 160 288 172 288 Z"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 290) scale(1.12) translate(-256 -290)">
  <!-- soft shadow, then a white sticker edge -->
  <use href="#shapes" fill="#EBB7CD" stroke="#EBB7CD" stroke-width="30" stroke-linejoin="round" transform="translate(0 10)"/>
