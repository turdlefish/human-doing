  <circle cx="222" cy="380" r="12.5" fill="#5B3A50"/>
  <circle cx="290" cy="380" r="12.5" fill="#5B3A50"/>
  <circle cx="226.5" cy="375" r="4.6" fill="#FFFFFF"/>
  <circle cx="294.5" cy="375" r="4.6" fill="#FFFFFF"/>
  <path d="M245 394 Q256 405 267 394" fill="none" stroke="#5B3A50" stroke-width="8" stroke-linecap="round"/>
